<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="avatar">
      <circle cx="350" cy="145" r="105"/>
    </clipPath>
  </defs>

  <style>
    .ring {
      fill: none;
      stroke: url(#ring);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 80 30 15 25;
      transform-origin: 350px 145px;
      animation: spin 5s linear infinite;
      filter: url(#glow);
    }

    .pulse {
      fill: none;
      stroke: #38bdf8;
      stroke-width: 2;
      opacity: .45;
      animation: pulse 2s ease-in-out infinite;
    }

    .scan {
      fill: #38bdf8;
      opacity: 0;
      animation: scan 3s ease-in-out infinite;
    }

    .name {
      fill: #ffffff;
      font-family: monospace;
      font-size: 34px;
      font-weight: bold;
      text-anchor: middle;
      stroke-dasharray: 500;
      stroke-dashoffset: 500;
      animation: write 3s steps(18) infinite;
    }

    .subtitle {
      fill: #94a3b8;
      font-family: monospace;
      font-size: 16px;
      text-anchor: middle;
      opacity: 0;
      animation: fade 3s ease-in-out infinite;
    }

    .cursor {
      fill: #38bdf8;
      animation: blink 1s step-end infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(.92); opacity: .25; }
      50% { transform: scale(1.08); opacity: .75; }
    }

    @keyframes scan {
      0%, 15% { opacity: 0; transform: translateY(35px); }
      30%, 65% { opacity: .65; }
      85%, 100% { opacity: 0; transform: translateY(175px); }
    }

    @keyframes write {
      0%, 10% { stroke-dashoffset: 500; fill: transparent; }
      45%, 85% { stroke-dashoffset: 0; fill: #ffffff; }
      100% { stroke-dashoffset: 500; fill: transparent; }
    }

    @keyframes fade {
      0%, 35%, 90%, 100% { opacity: 0; }
      50%, 80% { opacity: 1; }
    }

    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>

  <rect width="700" height="420" rx="24" fill="url(#bg)"/>

  <circle class="pulse" cx="350" cy="145" r="117"/>
  <circle class="ring" cx="350" cy="145" r="114"/>

  <image
    href="./profile-picture.jpg.png"
    x="245"
    y="40"
    width="210"
    height="210"
    preserveAspectRatio="xMidYMid slice"
    clip-path="url(#avatar)"
  />

  <rect class="scan" x="245" y="40" width="210" height="3" clip-path="url(#avatar)"/>

  <text class="name" x="350" y="315">Delshad Mohammed</text>
  <rect class="cursor" x="550" y="285" width="10" height="36"/>

  <text class="subtitle" x="350" y="355">
    Welcome to my GitHub
  </text>
</svg>
