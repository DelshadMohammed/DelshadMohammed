<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260">
  <style>
    .line {
      font-family: monospace;
      font-size: 18px;
      fill: #38bdf8;
      white-space: pre;
    }

    .title {
      font-family: monospace;
      font-size: 28px;
      font-weight: bold;
      fill: #ffffff;
    }

    .cursor {
      fill: #38bdf8;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    .glow {
      filter: drop-shadow(0 0 5px #38bdf8);
    }
  </style>

  <rect width="100%" height="100%" rx="18" fill="#0f172a"/>

  <text x="40" y="55" class="title glow">DELShad Mohammed</text>

  <text x="40" y="100" class="line">      ______     _           _               _</text>
  <text x="40" y="125" class="line">     |  _  |___| |__   __ _| |__   __ _  __| |</text>
  <text x="40" y="150" class="line">     | | | / __| '_ \ / _` | '_ \ / _` |/ _` |</text>
  <text x="40" y="175" class="line">     | |_| \__ \ | | | (_| | | | | (_| | (_| |</text>
  <text x="40" y="200" class="line">     |____/|___/_| |_|\__,_|_| |_|\__,_|\__,_|</text>

  <text x="40" y="235" class="line">     Building quietly behind the scenes</text>
  <rect x="405" y="218" width="10" height="22" class="cursor"/>
</svg>
